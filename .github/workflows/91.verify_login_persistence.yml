name: "M7A 91 · Verify Login Persistence"

# 目的：回答整个方案的生死问题
#   Q: 把上一次抓到的登录态塞回去，能不能【不用扫码】直接进游戏？
#
# 与 10 号的区别：不提供任何人工扫码机会（不传二维码、等待窗只有几分钟）。
#   - 出现「检测到登录成功」且【没有】扫码提示 → 登录态可移植 ✅
#   - 出现「请使用手机米游社 APP 扫描」        → 需要重新扫码 ❌
#
# 建议在不同日期重复跑，记录「登录态存活了几天、跨不跨 runner」。

on:
  workflow_dispatch:
    inputs:
      state_artifact:
        description: "10 号 workflow 产出的 artifact 名"
        required: true
        default: "m7a-login-state"
      wait_minutes:
        description: "最多观察多少分钟"
        required: false
        default: "10"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      IMAGE: ghcr.io/moesnow/march7thassistant:latest
      CNAME: m7a-verify
      # 与 10 号一致：放 /tmp，避免容器 root 污染 $GITHUB_WORKSPACE
      STATE_DIR: /tmp/m7a-state
      LOGIN_TIMEOUT_MIN: "25"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download captured login state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # actions/download-artifact 默认只能取同一次 run 的产物，
          # 跨 run 必须走 API。这里直接用 API 定位并下载。
          ART_NAME="${{ github.event.inputs.state_artifact }}"
          mkdir -p /tmp/downloaded
          echo "查找产物: $ART_NAME"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts?per_page=100" \
               -o /tmp/arts.json
          python3 - <<PY
          import json, sys
          arts = json.load(open("/tmp/arts.json"))["artifacts"]
          name = "$ART_NAME"
          match = [a for a in arts if a["name"] == name and not a["expired"]]
          if not match:
              print(f"::error::找不到未过期的产物 {name}；现有：")
              for a in arts[:10]:
                  print(f"  {a['name']} expired={a['expired']} run={a['workflow_run']['id']}")
              sys.exit(1)
          match.sort(key=lambda a: a["created_at"], reverse=True)
          best = match[0]
          print(f"选中产物 id={best['id']} 大小={best['size_in_bytes']} 创建于={best['created_at']}")
          print(f"来自 run {best['workflow_run']['id']}")
          open("/tmp/art_id.txt", "w").write(str(best["id"]))
          PY
          ART_ID="$(cat /tmp/art_id.txt)"
          echo "下载 artifact $ART_ID ..."
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
               "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/$ART_ID/zip" \
               -o /tmp/art.zip
          ls -lh /tmp/art.zip
          cd /tmp/downloaded && python3 -c "import zipfile; zipfile.ZipFile('/tmp/art.zip').extractall('.')"
          echo "=== 解压结果 ==="
          find /tmp/downloaded -type f -printf '%10s  %p\n' | sort -k2

      - name: Unpack state
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR"
          TARBALL="$(find /tmp/downloaded -name '*.tar.gz' | head -n 1)"
          if [ -z "$TARBALL" ]; then echo "::error::没找到 tar.gz"; exit 1; fi
          echo "解包 $TARBALL"
          tar -xzf "$TARBALL" -C "$STATE_DIR"

          # 容器内以 root 运行，挂载目录需要可写
          mkdir -p "$STATE_DIR/UserProfile" "$STATE_DIR/logs" "$STATE_DIR/settings"
          chmod -R 0777 "$STATE_DIR" || true

          # 若无 config.yaml（10 号早期版本没打包），现场生成一份
          if [ ! -f "$STATE_DIR/config.yaml" ]; then
            cp assets/config/config.example.yaml "$STATE_DIR/config.yaml"
          fi
          if command -v python3 >/dev/null 2>&1; then
            python3 - "$STATE_DIR/config.yaml" "$LOGIN_TIMEOUT_MIN" <<'PY'
          import re, sys
          path, timeout = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r'^cloud_game_login_timeout:.*$',
                        f'cloud_game_login_timeout: {timeout}', text, count=1, flags=re.M)
          text = re.sub(r'^after_finish:.*$',
                        'after_finish: Exit', text, count=1, flags=re.M)
          open(path, "w", encoding="utf-8").write(text)
          PY
          fi

          echo "--- 解包结果 ---"
          du -sh "$STATE_DIR"/* 2>/dev/null || true
          echo "--- 登录态抓取时间 ---"
          cat "$STATE_DIR/logs/.captured_at" 2>/dev/null || echo "unknown（10 号未写入时间戳）"

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Start container — NO QR ALLOWED
        run: |
          set -euo pipefail
          # 关键：不设置任何交互可能。若登录态无效，程序会自行走二维码流程，
          # 那正是我们要观测的"失败信号"。
          docker run -d \
            --name "$CNAME" \
            --shm-size=2g \
            -v "$STATE_DIR/UserProfile":/m7a/3rdparty/WebBrowser/UserProfile \
            -v "$STATE_DIR/logs":/m7a/logs \
            -v "$STATE_DIR/settings":/m7a/settings \
            -v "$STATE_DIR/config.yaml":/m7a/config.yaml \
            -e MARCH7TH_CLOUD_GAME_ENABLE=true \
            -e MARCH7TH_BROWSER_HEADLESS_ENABLE=true \
            -e MARCH7TH_BROWSER_HEADLESS_RESTART_ON_NOT_LOGGED_IN=false \
            -e MARCH7TH_AFTER_FINISH=Exit \
            -e MARCH7TH_LOG_LEVEL=DEBUG \
            "$IMAGE"
          sleep 5
          docker ps -a --filter "name=$CNAME"

      - name: Observe
        id: observe
        run: |
          set -uo pipefail
          WAIT="${{ github.event.inputs.wait_minutes }}"
          deadline=$(( $(date +%s) + WAIT * 60 ))
          result=pending

          # 判定优先级（实测校准）：
          #   1. 出现「云游戏剩余时长：」= 已登录会话才拿得到，是最强证据
          #   2. 「检测到登录成功」= 明确信号
          #   3. 「请扫码 / 等待扫码」= 需要重新扫码，失败
          #   4. 容器退出要结合上下文判断：若退出前已出现前两条，仍算成功
          while [ "$(date +%s)" -lt "$deadline" ]; do
            docker logs "$CNAME" > /tmp/m7a.log 2>&1 || true

            if grep -qE "云游戏剩余时长：" /tmp/m7a.log 2>/dev/null; then
              result=logged_in; break
            fi
            if grep -qE "检测到登录成功|进入云游戏成功" /tmp/m7a.log 2>/dev/null; then
              result=logged_in; break
            fi
            if grep -qE "请使用手机米游社 APP 扫描|等待扫码" /tmp/m7a.log 2>/dev/null; then
              result=needs_qr; break
            fi
            if ! docker ps --filter "name=$CNAME" --filter "status=running" --format '{{.Names}}' | grep -q "$CNAME"; then
              # 容器退出前若已登录，说明会话有效，只是后续步骤失败
              if grep -qE "云游戏剩余时长：|检测到登录成功" /tmp/m7a.log 2>/dev/null; then
                result=logged_in_then_exited
              else
                result=container_exited
              fi
              break
            fi
            sleep 10
          done
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "=== 判定结果: $result ==="
          echo "=== 剩余时长证据 ==="
          grep -E "云游戏剩余时长" /tmp/m7a.log || echo "  (无)"
          echo "=== 日志尾部 ==="
          tail -n 120 /tmp/m7a.log || true

      - name: Verdict
        if: always()
        run: |
          set -uo pipefail
          RESULT="${{ steps.observe.outputs.result }}"
          {
            echo "## 🧪 登录态可移植性验证"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 结果 | \`$RESULT\` |"
            echo "| 登录态抓取于 | $(cat "$STATE_DIR/logs/.captured_at" 2>/dev/null || echo unknown) |"
            echo "| 本次运行 | $(date -u +%FT%TZ) |"
            echo "| runner | ${{ runner.name }} / ${{ runner.os }} |"
            echo "| 公网 IP | $(curl -s --max-time 10 https://api.ipify.org || echo unknown) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          case "$RESULT" in
            logged_in)
              echo "✅ **登录态可移植**：无需扫码即通过登录检查，方案成立。" >> "$GITHUB_STEP_SUMMARY" ;;
            logged_in_then_exited)
              echo "✅ **登录态可移植**（容器随后退出）：已确认通过登录检查，" >> "$GITHUB_STEP_SUMMARY"
              echo "退出发生在进入游戏阶段，属云游戏侧的排队/时长问题，与登录态无关。" >> "$GITHUB_STEP_SUMMARY" ;;
            needs_qr)
              echo "❌ **登录态失效**：程序要求重新扫码。该时间点登录态已过期，或绑定了环境。" >> "$GITHUB_STEP_SUMMARY" ;;
            container_exited)
              echo "⚠️ **容器退出且未见登录证据**：需要看日志判断原因。" >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              echo "⏳ **超时未判定**：既没登录也没要求扫码。" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Dump log and relax permissions
        if: always()
        run: |
          set -uo pipefail
          docker logs "$CNAME" > /tmp/m7a-run.log 2>&1 || true
          docker stop "$CNAME" || true
          docker rm "$CNAME" || true

          # 容器以 root 运行，挂载目录会带 root 属主与 700 权限，
          # runner 用户随后读不了（实测 tar 只能打出空壳）。
          # 用一次性容器统一放开权限，与 90 号保持一致。
          echo "=== 放开权限前 ==="
          ls -ld "$STATE_DIR" "$STATE_DIR"/UserProfile 2>/dev/null || true
          docker run --rm -v "$STATE_DIR":/s alpine:3 sh -c \
            'chmod -R a+rwX /s 2>/dev/null || true; echo done' || true
          echo "=== 放开权限后 ==="
          ls -ld "$STATE_DIR" "$STATE_DIR"/UserProfile 2>/dev/null || true

          # 把运行后的 profile 也导出来，便于对比"回灌前后"的差异
          if [ -d "$STATE_DIR/UserProfile/Integrated" ]; then
            tar -czf /tmp/profile-after.tar.gz -C "$STATE_DIR/UserProfile" Integrated 2>/dev/null \
              && ls -lh /tmp/profile-after.tar.gz || echo "::warning::导出 profile 失败"
          fi

          cp /tmp/m7a-run.log m7a-run.log 2>/dev/null || true

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m7a-verify-log
          path: |
            m7a-run.log
            /tmp/profile-after.tar.gz
          retention-days: 7
          if-no-files-found: warn
