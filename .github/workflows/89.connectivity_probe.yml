name: "M7A 89 · Connectivity Probe"

# 目的：在让人扫码之前，先花 1 分钟排除一个致命变量 ——
#       GitHub Actions 的海外数据中心 IP，能不能正常访问米哈游的
#       云游戏站点与登录平台？
#
# 若这里就不通，后面所有工作都没有意义。纯 HTTP 探测，不启动浏览器、不涉及任何凭据。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Egress identity
        run: |
          set -uo pipefail
          echo "### 出口环境"
          echo "| 项 | 值 |"
          echo "|---|---|"
          echo "| 公网 IP | $(curl -s --max-time 10 https://api.ipify.org || echo unknown) |"
          echo "| 地区 | $(curl -s --max-time 10 https://ipinfo.io/country || echo unknown) |"
          echo "| ASN | $(curl -s --max-time 10 https://ipinfo.io/org || echo unknown) |"

      - name: Probe mihoyo endpoints
        run: |
          set -uo pipefail
          {
            echo "## 🌐 米哈游端点连通性"
            echo
            echo "| 端点 | 最终 HTTP | 耗时(s) | 大小(bytes) | 跳转到 |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # 注意：必须 -L 跟随重定向，否则拿到的是 307 响应体，不是真实页面
          probe() {
            local label="$1" url="$2"
            local meta code time size final
            meta=$(curl -sL -o "/tmp/p_${label}.bin" \
                        -w '%{http_code} %{time_total} %{url_effective}' \
                        --max-time 45 \
                        -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
                        "$url" 2>/dev/null) || meta="000 0 $url"
            code=$(echo "$meta" | awk '{print $1}')
            time=$(echo "$meta" | awk '{print $2}')
            final=$(echo "$meta" | cut -d' ' -f3-)
            size=$(stat -c%s "/tmp/p_${label}.bin" 2>/dev/null || echo 0)
            echo "| \`$label\` | $code | $time | $size | \`$final\` |" >> "$GITHUB_STEP_SUMMARY"
            printf '%-34s http=%s size=%-8s final=%s\n' "$label" "$code" "$size" "$final"
          }

          # curl 成功（含 4xx）本身就证明网络可达；这里关注的是能否拿到真实内容
          probe "sr-cloud"      "https://sr.mihoyo.com/cloud/"
          probe "user-passport" "https://user.mihoyo.com/"
          probe "webapi-account" "https://webapi.account.mihoyo.com/"
          echo

      - name: Verify expected DOM hooks exist in the page
        run: |
          set -uo pipefail
          BODY="/tmp/p_sr-cloud.bin"
          {
            echo "## 🔍 关键 DOM 锚点（代码里硬依赖的 selector）"
            echo
            echo "| 锚点 | 代码位置 | 是否出现 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s "$BODY" ]; then
            echo "::error::没拿到 sr.mihoyo.com/cloud 的页面内容"
            echo "| (无内容) | | ❌ |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          check() {
            local pattern="$1" where="$2"
            if grep -q "$pattern" "$BODY"; then
              echo "| \`$pattern\` | $where | ✅ |" >> "$GITHUB_STEP_SUMMARY"
              echo "  ✅ $pattern"
            else
              echo "| \`$pattern\` | $where | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              echo "  ❌ $pattern"
            fi
          }

          check "mihoyo-login-platform-iframe" "cloud.py:588 _check_login"
          check "game-player"                  "cloud.py:1230 is_in_game"
          check "wel-card__content--start"     "cloud.py:635 _click_enter_game"
          echo
          echo "页面大小: $(stat -c%s "$BODY") 字节"
          echo
          echo "### 页面首 600 字节（判断是否被风控/地区拦截页替换）"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -c 600 "$BODY" | tr -d '\000' >> "$GITHUB_STEP_SUMMARY" || true
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dump raw page for offline inspection
        run: |
          set -uo pipefail
          BODY="/tmp/p_sr-cloud.bin"
          if [ -s "$BODY" ]; then
            echo "=== 完整页面（$(stat -c%s "$BODY") 字节）==="
            cat "$BODY"
            echo
            echo "=== 行数 ==="
            wc -l "$BODY"
            echo "=== SPA 挂载点 ==="
            grep -oE '<div id="[^"]*"' "$BODY" | sort -u | head -n 20 || true
            echo "=== 引用的 JS ==="
            grep -oE 'src="[^"]*\.js[^"]*"' "$BODY" | head -n 20 || true
          else
            echo "::error::sr.mihoyo.com/cloud 没返回内容"
          fi

      - name: Upload raw page
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: probe-raw-page
          path: |
            /tmp/p_sr-cloud.bin
            /tmp/p_user-passport.bin
          if-no-files-found: warn
          retention-days: 3
          overwrite: true
