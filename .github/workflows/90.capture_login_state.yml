name: "M7A 90 · Capture Login State"

# 目的：在 Docker 云游戏模式下完成一次人工扫码登录，并把「登录态」抓出来，
#       用于回答整个方案最关键的一个事实问题：
#       —— 登录态到底能不能被保存下来、并在别的地方恢复？
#
# 手动触发。跑起来后请看 job summary，里面有二维码链接和图片。

on:
  workflow_dispatch:
    inputs:
      login_wait_minutes:
        description: "扫码窗口分钟数（给足时间，程序会自动刷新二维码）"
        required: false
        default: "24"
      keep_days:
        description: "产物保留天数"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      IMAGE: ghcr.io/moesnow/march7thassistant:latest
      CNAME: m7a-capture
      # 刻意放在 /tmp：容器以 root 写入挂载目录后，$GITHUB_WORKSPACE 会残留
      # root 属主文件，Actions 事后清理工作区时会失败。
      STATE_DIR: /tmp/m7a-state
      # 容器内云游戏登录等待超时（分钟）。它从"进入登录流程"时才起算，
      # 而前面还有镜像拉取/解包（约 4GB）+ 浏览器启动的开销，所以这里的
      # 12 分钟等码窗口与 22 分钟等人扫码窗口不会叠加超过它。
      LOGIN_TIMEOUT_MIN: "25"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare state dir and config
        run: |
          set -euo pipefail
          rm -rf "$STATE_DIR"
          mkdir -p "$STATE_DIR/UserProfile" "$STATE_DIR/logs" "$STATE_DIR/settings"
          chmod -R 0777 "$STATE_DIR"

          # 用官方示例配置打底，生成容器用的 config.yaml。
          # 镜像本身不带 config.yaml（Dockerfile 里删掉了），缺失时会静默套用内置默认值。
          #
          # 关键：after_finish 必须是 Loop，不能是 Exit。
          # tasks/game/__init__.py:271-276 里，非 Loop 会走 shutdown()+sys.exit(0)，
          # 进程在登录超时后直接退出 → 容器死亡 → 用户扫码时浏览器早没了。
          # Loop 则让进程保活并等待下一个定时点，二维码可持续刷新。
          cp assets/config/config.example.yaml "$STATE_DIR/config.yaml"

          if command -v python3 >/dev/null 2>&1; then
            python3 - "$STATE_DIR/config.yaml" "$LOGIN_TIMEOUT_MIN" <<'PY'
          import re, sys
          path, timeout = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r'^cloud_game_login_timeout:.*$',
                        f'cloud_game_login_timeout: {timeout}', text, count=1, flags=re.M)
          text = re.sub(r'^after_finish:.*$',
                        'after_finish: Loop', text, count=1, flags=re.M)
          open(path, "w", encoding="utf-8").write(text)
          PY
          else
            sed -i "s/^cloud_game_login_timeout:.*/cloud_game_login_timeout: $LOGIN_TIMEOUT_MIN/" "$STATE_DIR/config.yaml"
            sed -i "s/^after_finish:.*/after_finish: Loop/" "$STATE_DIR/config.yaml"
          fi

          echo "--- 生效的关键配置 ---"
          grep -E '^(cloud_game_enable|cloud_game_login_timeout|browser_headless_enable|browser_headless_restart_on_not_logged_in|after_finish):' "$STATE_DIR/config.yaml" || true
          sha256sum "$STATE_DIR/config.yaml" > "$STATE_DIR/config.sha256"
          cat "$STATE_DIR/config.sha256"

      - name: Pre-flight connectivity to mihoyo
        run: |
          set -uo pipefail
          # 实测教训：user.mihoyo.com 在 runner 上会间歇性 ERR_TIMED_OUT，
          # 直接导致二维码登录失败。先探一次，失败就立刻重试，别等 4 分钟后才发现。
          for host in "https://sr.mihoyo.com/cloud/" "https://user.mihoyo.com/"; do
            ok=no
            for attempt in 1 2 3 4 5; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 25 \
                       -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36' \
                       "$host" 2>/dev/null || echo 000)
              echo "  [$attempt/5] $host -> $code"
              if [ "$code" = "200" ]; then ok=yes; break; fi
              sleep 5
            done
            if [ "$ok" != "yes" ]; then
              echo "::warning::$host 连续 5 次不可达，本次运行大概率失败"
            fi
          done

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Start container (cloud game + headless)
        run: |
          set -euo pipefail
          docker rm -f "$CNAME" 2>/dev/null || true
          docker run -d \
            --name "$CNAME" \
            --shm-size=2g \
            -v "$STATE_DIR/UserProfile":/m7a/3rdparty/WebBrowser/UserProfile \
            -v "$STATE_DIR/logs":/m7a/logs \
            -v "$STATE_DIR/settings":/m7a/settings \
            -v "$STATE_DIR/config.yaml":/m7a/config.yaml \
            -e MARCH7TH_CLOUD_GAME_ENABLE=true \
            -e MARCH7TH_BROWSER_HEADLESS_ENABLE=true \
            -e MARCH7TH_BROWSER_HEADLESS_RESTART_ON_NOT_LOGGED_IN=false \
            -e MARCH7TH_LOG_LEVEL=DEBUG \
            "$IMAGE"
          sleep 3
          docker ps -a --filter "name=$CNAME"

      - name: Wait for QR flow (with retry on load failure)
        id: qr
        run: |
          set -uo pipefail
          # 实测教训：应用在页面加载失败时会自己重试 3 次（每次约 30 秒）后放弃，
          # 而 E2E 日志里已出现 ERR_TIMED_OUT。这里再加一层外部重启重试。
          MAX_RELAUNCH=3
          attempt=0
          found=no
          overall_deadline=$(( $(date +%s) + 1500 ))
          while [ "$attempt" -le "$MAX_RELAUNCH" ] && [ "$found" != "yes" ]; do
            if [ "$attempt" -gt 0 ]; then
              echo "::warning::页面加载失败，重启容器重试 ($attempt/$MAX_RELAUNCH)"
            fi
            attempt=$(( attempt + 1 ))
            deadline=$(( $(date +%s) + 360 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              docker logs "$CNAME" > /tmp/m7a.log 2>&1 || true
              if grep -qE "等待扫码|qrcode_login" /tmp/m7a.log 2>/dev/null; then found=yes; break; fi
              if grep -qE "页面加载失败，多次刷新无效" /tmp/m7a.log 2>/dev/null; then
                echo "检测到应用侧页面加载失败，准备重启容器"
                break
              fi
              if ! docker ps --filter "name=$CNAME" --filter "status=running" --format '{{.Names}}' | grep -q "$CNAME"; then
                echo "容器已退出"; break
              fi
              sleep 5
            done
            [ "$found" = "yes" ] && break
            [ "$(date +%s)" -ge "$overall_deadline" ] && { echo "::warning::总时限到，停止重试"; break; }
            # 重启容器（保留 profile 与 config）
            docker rm -f "$CNAME" >/dev/null 2>&1 || true
            docker run -d \
              --name "$CNAME" \
              --shm-size=2g \
              -v "$STATE_DIR/UserProfile":/m7a/3rdparty/WebBrowser/UserProfile \
              -v "$STATE_DIR/logs":/m7a/logs \
              -v "$STATE_DIR/settings":/m7a/settings \
              -v "$STATE_DIR/config.yaml":/m7a/config.yaml \
              -e MARCH7TH_CLOUD_GAME_ENABLE=true \
              -e MARCH7TH_BROWSER_HEADLESS_ENABLE=true \
              -e MARCH7TH_BROWSER_HEADLESS_RESTART_ON_NOT_LOGGED_IN=false \
              -e MARCH7TH_LOG_LEVEL=DEBUG \
              "$IMAGE" >/dev/null
            sleep 8
          done
          echo "found=$found  尝试次数=$attempt" >> "$GITHUB_OUTPUT"
          echo "found=$found attempts=$attempt"
          echo "=== 容器日志尾部 ==="
          tail -n 100 /tmp/m7a.log || true

      - name: Extract QR payload
        if: always()
        run: |
          set -uo pipefail
          docker logs "$CNAME" > /tmp/m7a.log 2>&1 || true
          # 先把容器状态摊开，避免"等码超时"时无从判断
          echo "=== 容器状态 ==="
          docker ps -a --filter "name=$CNAME"
          docker inspect "$CNAME" --format 'status={{.State.Status}} exitcode={{.State.ExitCode}} oom={{.State.OOMKilled}}' 2>/dev/null || true
          echo "=== 日志行数: $(wc -l < /tmp/m7a.log 2>/dev/null || echo 0) ==="
          echo "=== 关键信号 ==="
          grep -oE "未登录|正在切换到二维码登录|等待二维码加载|二维码已加载|二维码内容|等待扫码|启动浏览器中|浏览器启动成功|Traceback|Error|错误|超时" /tmp/m7a.log \
            | sort | uniq -c | sort -rn || true

          {
            echo "## 🔑 M7A 登录态抓取"
            echo
            echo "### 请用【米游社 APP】扫描下面的链接"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # 上游在 _decode_qr_from_element 里会把二维码内容（一个 URL）打进日志
          grep -oE 'https://[^[:space:]]+' /tmp/m7a.log | sort -u > /tmp/all_links.txt || true
          grep -E 'qrcode|scan|login' /tmp/all_links.txt > /tmp/links.txt || true
          [ -s /tmp/links.txt ] || cp /tmp/all_links.txt /tmp/links.txt

          if [ -s /tmp/links.txt ]; then
            link="$(head -n 1 /tmp/links.txt)"
            {
              echo "扫码链接：\`$link\`"
              echo
              echo "👉 **[点这里打开二维码](${link})** —— 页面本身就是二维码"
              echo
              echo "或者把这段链接贴进任意二维码生成器（如 cli.im）再扫。"
              echo
              echo "<details><summary>全部候选链接</summary>"
              echo
              echo '```'
              cat /tmp/links.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "--- 候选链接 ---"; cat /tmp/links.txt
          else
            echo "日志里没抓到链接，请改用 qrcode 产物里的图片。" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::没从日志解出二维码链接"
          fi

          # 从容器里把二维码图片抠出来（比挂载目录更可靠）
          docker cp "$CNAME:/m7a/logs/qrcode_login.png" /tmp/qrcode_login.png 2>/dev/null \
            && echo "二维码图片已从容器取出" \
            || echo "::warning::容器内没找到 qrcode_login.png"

      - name: Upload QR image immediately
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: qrcode
          path: /tmp/qrcode_login.png
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

      - name: Wait for scan
        id: scan
        run: |
          set -uo pipefail
          WAIT="${{ github.event.inputs.login_wait_minutes }}"
          echo "扫码窗口 ${WAIT} 分钟。二维码会持续刷新并写入本次运行的 Summary。"
          deadline=$(( $(date +%s) + WAIT * 60 ))
          logged_in=no
          last_qr=""
          restarts=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            docker logs "$CNAME" > /tmp/m7a.log 2>&1 || true

            # 1) 登录成功 → 立刻收工
            if grep -qE "检测到登录成功|进入云游戏成功" /tmp/m7a.log 2>/dev/null; then
              logged_in=yes; echo "✅ 检测到登录成功"; break
            fi

            # 2) 二维码会自动过期并刷新，把最新那个实时写进 Summary。
            #    这样用户任何时候打开页面看到的都是当前有效的码。
            cur=$(grep -oE 'https://user\.mihoyo\.com/login-platform/[^[:space:]]+' /tmp/m7a.log 2>/dev/null | tail -n 1)
            if [ -n "$cur" ] && [ "$cur" != "$last_qr" ]; then
              last_qr="$cur"
              {
                echo "## 🔑 当前有效二维码（$(date -u +%H:%M:%SZ) 更新）"
                echo
                echo "### 👉 [点这里打开二维码]($cur)"
                echo
                echo '```'
                echo "$cur"
                echo '```'
                echo
              } >> "$GITHUB_STEP_SUMMARY"
              echo "--- 新二维码 $(date -u +%H:%M:%SZ) ---"
              echo "$cur"
            fi

            # 3) 程序侧登录超时不再终止等待 —— after_finish=Loop 会让它进入下一轮，
            #    并弹出新的二维码。这里只记一笔，继续等。
            if grep -qE "等待云游戏登录超时" /tmp/m7a.log 2>/dev/null; then
              if [ "$logged_in" != "timeout_seen" ]; then
                logged_in=timeout_seen
                echo "⏰ 程序侧一轮登录超时，等待下一轮新二维码（继续等）"
              fi
            fi

            # 4) 容器真的死了才退出
            if ! docker ps --filter "name=$CNAME" --filter "status=running" --format '{{.Names}}' | grep -q "$CNAME"; then
              restarts=$(( restarts + 1 ))
              echo "::warning::容器已退出（第 $restarts 次）"
              break
            fi
            sleep 10
          done
          echo "logged_in=$logged_in  restarts=$restarts"
          echo "logged_in=$logged_in" >> "$GITHUB_OUTPUT"
          echo "=== 日志尾部 ==="
          tail -n 80 /tmp/m7a.log || true
          echo "logged_in=$logged_in" >> "$GITHUB_OUTPUT"

      - name: If never logged in, wait for the app to time out cleanly
        if: always()
        run: |
          set -uo pipefail
          if [ "${{ steps.scan.outputs.logged_in }}" = "yes" ]; then
            echo "已登录，跳过。"
            exit 0
          fi
          # 没登录成功就把容器停掉，不必再等。
          # after_finish=Loop 会让程序一直保活，等下去没有意义。
          echo "未检测到登录成功，直接收尾并导出当前状态。"
          tail -n 40 /tmp/m7a.log || true

      - name: Stop container
        if: always()
        run: |
          docker logs "$CNAME" > "$STATE_DIR/container.log" 2>&1 || true
          docker stop "$CNAME" || true
          docker rm "$CNAME" || true
          # 记录抓取时刻，供 11 号 workflow 判断登录态"活了多少天"
          date -u +%FT%TZ > "$STATE_DIR/logs/.captured_at" || true
          echo "captured_at=$(cat "$STATE_DIR/logs/.captured_at")"

      - name: Inspect captured state (this is the real measurement)
        if: always()
        run: |
          set -uo pipefail
          echo "### UserProfile 体积"
          du -sh "$STATE_DIR/UserProfile" 2>/dev/null || echo "(空)"
          echo
          echo "### UserProfile 下的子目录（目录名取自 browser_type.capitalize()）"
          ls -la "$STATE_DIR/UserProfile" 2>/dev/null || echo "(空)"
          echo
          # cloud.py: user_profile_path = BROWSER_INSTALL_PATH/UserProfile/<browser_type.capitalize()>
          # 默认 browser_type=integrated -> Integrated
          PROF=""
          for cand in Integrated Chrome Edge Chromium; do
            if [ -d "$STATE_DIR/UserProfile/$cand" ]; then PROF="$STATE_DIR/UserProfile/$cand"; break; fi
          done
          if [ -z "$PROF" ]; then
            echo "::warning::没能定位 profile 子目录"
          else
            echo "定位到 profile: $PROF"
            echo
            echo "### 登录相关的关键文件"
            for rel in "Default/Cookies" "Default/Local Storage" "Default/IndexedDB" "Default/Preferences" "Default/Session Storage" "Local State"; do
              if [ -e "$PROF/$rel" ]; then echo "✅ $rel"; else echo "❌ $rel"; fi
            done
            echo
            echo "### Cookies 明细（含过期时间）—— 判断登录态寿命的直接证据"
            if command -v sqlite3 >/dev/null 2>&1 && [ -f "$PROF/Default/Cookies" ]; then
              sqlite3 "$PROF/Default/Cookies" \
                "SELECT host_key, name, length(value) AS vlen, datetime(expires_utc/1000000-11644473600,'unixepoch') AS expires_utc_time FROM cookies ORDER BY host_key, name;" || true
            else
              echo "(没有 sqlite3 或没有 Cookies 文件)"
            fi
            echo
            echo "### localStorage (leveldb) 文件"
            ls -la "$PROF/Default/Local Storage/leveldb" 2>/dev/null | head -n 20 || true
          fi

      - name: Check whether config.yaml was mutated
        if: always()
        run: |
          set -uo pipefail
          echo "### config.yaml 是否被程序改写（关系到能否安全挂载）"
          if sha256sum -c "$STATE_DIR/config.sha256" 2>/dev/null; then
            echo "✅ 未被改写"
          else
            echo "⚠️ 被程序改写过 —— 后续若要挂载自定义配置需要改为容器内副本"
            diff <(sed 's/[[:space:]]*$//' assets/config/config.example.yaml) \
                 <(sed 's/[[:space:]]*$//' "$STATE_DIR/config.yaml") | head -n 40 || true
          fi

      - name: Pack login state
        if: always()
        run: |
          set -euo pipefail
          tar -czf /tmp/m7a-login-state.tar.gz -C "$STATE_DIR" UserProfile settings logs config.yaml 2>/dev/null \
            || tar -czf /tmp/m7a-login-state.tar.gz -C "$STATE_DIR" . || true
          ls -lh /tmp/m7a-login-state.tar.gz

      - name: Upload login state
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m7a-login-state
          path: /tmp/m7a-login-state.tar.gz
          retention-days: ${{ github.event.inputs.keep_days }}
          if-no-files-found: error
